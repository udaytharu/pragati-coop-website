<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin Login Panel for Pragati SACCOS - Manage notices and news">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Login - प्रगति साकोस</title>
    <link rel="icon" href="/assets/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>
    <div class="admin-login-container">
        <div class="admin-login-box">
            <div class="admin-login-header">
                <i class="fas fa-shield-alt"></i>
                <h1>Admin Login</h1>
                <p>प्रगति साकोस व्यवस्थापन प्यानल</p>
            </div>
            <form id="adminLoginForm" class="admin-login-form">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i> Username
                    </label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                    <button type="button" class="toggle-password" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div id="loginError" class="error-message" style="display: none;"></div>
                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Login</span>
                    <span class="btn-loader" style="display: none;"><i class="fas fa-spinner fa-spin"></i> Logging in...</span>
                </button>
                <div class="forgot-password-link">
                    <a href="#" id="forgotPasswordLink">
                        <i class="fas fa-key"></i> Forgot Password?
                    </a>
                </div>
            </form>
            <div class="admin-login-footer">
                <a href="/index.html">
                    <i class="fas fa-arrow-left"></i> Back to Website
                </a>
            </div>
        </div>
    </div>
        <div class="footer">
        <p style="text-align: center;">Developed by <a href="www.udayrajchaudhary.com.np">Uday Tharu</a></p>
        </div>

    <!-- Password Recovery Modal -->
    <div id="recoveryModal" class="recovery-modal" style="display: none;">
        <div class="recovery-modal-content">
            <div class="recovery-modal-header">
                <h2><i class="fas fa-key"></i> Password Recovery</h2>
                <button class="recovery-modal-close" id="closeRecoveryModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="recovery-modal-body">
                <div id="recoveryStep1" class="recovery-step active">
                    <p class="recovery-description">Enter your username to begin password recovery.</p>
                    <div class="form-group">
                        <label for="recoveryUsername">
                            <i class="fas fa-user"></i> Username
                        </label>
                        <input type="text" id="recoveryUsername" name="recoveryUsername" required>
                    </div>
                    <div id="recoveryError" class="error-message" style="display: none;"></div>
                    <div id="recoverySuccess" class="success-message" style="display: none;"></div>
                    <button type="button" class="btn-primary" id="verifyUsernameBtn">
                        <i class="fas fa-arrow-right"></i> Continue
                    </button>
                </div>
                <div id="recoveryStep2" class="recovery-step" style="display: none;">
                    <p class="recovery-description">Answer your security question to reset your password.</p>
                    <div class="form-group">
                        <label for="securityQuestionDisplay">Security Question</label>
                        <div id="securityQuestionDisplay" class="security-question-display"></div>
                    </div>
                    <div class="form-group">
                        <label for="securityAnswer">
                            <i class="fas fa-shield-alt"></i> Your Answer
                        </label>
                        <input type="text" id="securityAnswer" name="securityAnswer" required>
                    </div>
                    <div id="recoveryError2" class="error-message" style="display: none;"></div>
                    <button type="button" class="btn-primary" id="verifyAnswerBtn">
                        <i class="fas fa-check"></i> Verify Answer
                    </button>
                    <button type="button" class="btn-secondary" id="backToStep1Btn">
                        <i class="fas fa-arrow-left"></i> Back
                    </button>
                </div>
                <div id="recoveryStep3" class="recovery-step" style="display: none;">
                    <p class="recovery-description">Enter your new password.</p>
                    <div class="form-group">
                        <label for="newPasswordRecovery">
                            <i class="fas fa-lock"></i> New Password
                        </label>
                        <input type="password" id="newPasswordRecovery" name="newPasswordRecovery" required minlength="6">
                        <small>Password must be at least 6 characters long</small>
                    </div>
                    <div class="form-group">
                        <label for="confirmPasswordRecovery">
                            <i class="fas fa-lock"></i> Confirm New Password
                        </label>
                        <input type="password" id="confirmPasswordRecovery" name="confirmPasswordRecovery" required minlength="6">
                    </div>
                    <div id="recoveryError3" class="error-message" style="display: none;"></div>
                    <button type="button" class="btn-primary" id="resetPasswordBtn">
                        <i class="fas fa-save"></i> Reset Password
                    </button>
                    <button type="button" class="btn-secondary" id="backToStep2Btn">
                        <i class="fas fa-arrow-left"></i> Back
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/js/admin.js"></script>
</body>
</html>
